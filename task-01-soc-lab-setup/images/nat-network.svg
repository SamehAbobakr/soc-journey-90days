
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs>
    <style>
      .title { font: bold 30px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 17px Arial, sans-serif; fill: #cbd5e1; }
      .heading { font: bold 21px Arial, sans-serif; fill: #f8fafc; }
      .label { font: bold 17px Arial, sans-serif; fill: #e2e8f0; }
      .ip { font: 16px monospace; fill: #cbd5e1; }
      .small { font: 14px Arial, sans-serif; fill: #94a3b8; }
      .card { fill: #1e293b; stroke: #475569; stroke-width: 2; }
      .nat { fill: #172554; stroke: #3b82f6; stroke-width: 2; }
      .host { fill: #052e2b; stroke: #10b981; stroke-width: 2; }
      .line-nat { stroke: #3b82f6; stroke-width: 4; fill: none; }
      .line-host { stroke: #10b981; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <rect width="1100" height="760" rx="18" fill="#0f172a"/>

  <text x="550" y="55" text-anchor="middle" class="title">SOC Virtual Lab Network Topology</text>
  <text x="550" y="86" text-anchor="middle" class="subtitle">VMware Workstation Pro | Dual Network Adapters</text>

  <!-- Windows VM -->
  <rect x="70" y="145" width="390" height="205" rx="14" class="card"/>
  <text x="265" y="185" text-anchor="middle" class="heading">Windows Pro VM</text>
  <text x="265" y="225" text-anchor="middle" class="label">Network Adapter 1 — NAT</text>
  <text x="265" y="252" text-anchor="middle" class="ip">192.168.153.133</text>
  <text x="265" y="290" text-anchor="middle" class="label">Network Adapter 2 — Host-only</text>
  <text x="265" y="318" text-anchor="middle" class="ip">192.168.231.130</text>

  <!-- Ubuntu VM -->
  <rect x="640" y="145" width="390" height="205" rx="14" class="card"/>
  <text x="835" y="185" text-anchor="middle" class="heading">Ubuntu Server VM</text>
  <text x="835" y="225" text-anchor="middle" class="label">Network Adapter 1 — NAT</text>
  <text x="835" y="252" text-anchor="middle" class="ip">192.168.153.132</text>
  <text x="835" y="290" text-anchor="middle" class="label">Network Adapter 2 — Host-only</text>
  <text x="835" y="318" text-anchor="middle" class="ip">192.168.231.129</text>

  <!-- NAT network -->
  <path d="M265 350 V415 H835 V350" class="line-nat"/>
  <rect x="340" y="405" width="420" height="105" rx="14" class="nat"/>
  <text x="550" y="442" text-anchor="middle" class="heading">VMware NAT Network</text>
  <text x="550" y="474" text-anchor="middle" class="ip">192.168.153.0/24</text>
  <text x="550" y="495" text-anchor="middle" class="small">Internet access through VMware NAT</text>

  <!-- Host-only network -->
  <path d="M265 350 V565 H835 V350" class="line-host"/>
  <rect x="340" y="555" width="420" height="105" rx="14" class="host"/>
  <text x="550" y="592" text-anchor="middle" class="heading">VMware Host-only Network</text>
  <text x="550" y="624" text-anchor="middle" class="ip">192.168.231.0/24</text>
  <text x="550" y="645" text-anchor="middle" class="small">Private communication network</text>

  <!-- Legend -->
  <line x1="390" y1="705" x2="440" y2="705" class="line-nat"/>
  <text x="450" y="711" class="small">NAT</text>
  <line x1="570" y1="705" x2="620" y2="705" class="line-host"/>
  <text x="630" y="711" class="small">Host-only</text>
</svg>
